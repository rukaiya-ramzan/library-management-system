<!-- Contact Form -->
<section class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card contact-card">

                <div class="card-body p-4 p-md-5">

                    <h4 class="fw-bold mb-2">
                        <i class="bi bi-chat-left-text me-2"></i>Send Us a Message
                    </h4>

                    <p class="section-text mb-4">
                        Please complete all the fields below.
                    </p>

                    <form id="contactForm" method="post" action="contact.php" onsubmit="return validateContactForm()">

                        <!-- Name -->
                        <div class="mb-4">

                            <label for="name" class="form-label fw-semibold">
                                <i class="bi bi-person me-2"></i>Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>

                        <!-- Email -->
                        <div class="mb-4">

                            <label for="email" class="form-label fw-semibold">
                                <i class="bi bi-envelope me-2"></i>Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="example@email.com"
                                required
                            >

                        </div>

                        <!-- Message -->
                        <div class="mb-4">

                            <label for="message" class="form-label fw-semibold">
                                <i class="bi bi-pencil-square me-2"></i>Your Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                class="form-control"
                                rows="5"
                                placeholder="Write your message here..."
                                required
                            ></textarea>

                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-3">

                            <button type="submit" class="btn btn-green">
                                <i class="bi bi-send me-2"></i>Send Message
                            </button>

                            <button type="reset" class="btn btn-outline-green">
                                <i class="bi bi-arrow-counterclockwise me-2"></i>Clear Form
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

<!-- JavaScript Validation -->
<script>
    function validateContactForm() {

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let message = document.getElementById("message").value.trim();

        if (name === "" || email === "" || message === "") {
            alert("Please complete all the fields!");
            return false;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            alert("Please enter a valid email address!");
            return false;
        }

        alert("Your form has been submitted successfully!");

        return true;
    }
</script>
